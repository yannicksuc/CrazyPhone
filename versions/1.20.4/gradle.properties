# Properties specific to the 1.20.4 build - shared mod metadata lives in the root gradle.properties.
# You can find the latest NeoForge versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.20.4
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.20.4,1.20.5)
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=20.4.250
# The Neo version range can use any version of Neo as bounds
neo_version_range=[20,)
# Simple Voice Chat addon API (optional integration - see fr.lordfinn.crazyphone.voicechat package).
# Compile-time only; find the latest at https://maven.maxhenkel.de/repository/public/de/maxhenkel/voicechat/voicechat-api/
voicechat_api_version=2.6.20
# Version suffix of the Camera mod jar expected at libs/camera-neoforge-<minecraft_version>-<camera_jar_version>.jar
camera_jar_version=1.0.9
