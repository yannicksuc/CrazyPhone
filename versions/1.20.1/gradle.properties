# Properties specific to the 1.20.1 legacy Forge/NeoForge build - shared mod metadata lives in the root
# gradle.properties. 1.20.1 predates NeoForge's own fork (net.minecraftforge.* -> net.neoforged.neoforge.*),
# so this node builds against the real, original net.minecraftforge:forge:1.20.1-47.1.x artifact via
# ModDevGradle's "legacyforge" plugin (see build.legacyforge.gradle.kts) - the officially blessed way to
# keep supporting 1.20.1 from within the modern NeoForge tooling ecosystem.
# You can find the latest 1.20.1 Forge versions here: https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
forge_version=47.4.23
forge_version_range=[47,)
loader_version_range=[47,)
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03
# Simple Voice Chat addon API (optional integration - see fr.lordfinn.crazyphone.voicechat package).
# Compile-time only (checked against ModList at runtime, see VoicechatIntegration.isAvailable()) - same
# version 1.20.4 already uses successfully, the API artifact itself isn't loader/MC-version-specific.
voicechat_api_version=2.6.20
